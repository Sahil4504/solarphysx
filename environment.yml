# Recreate on a new machine:  conda env create -f environment.yml
# Versions as installed 2026-10-08 (RTX 5070 Ti needs the CUDA 12.8 PyTorch build).
name: solarphysx
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - pandas==3.0.6
      - pyarrow==25.0.1
      - numpy==2.4.6
      - pvlib==0.16.1
      - shap==0.51.0
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - jupyter==1.1.1
      - ipykernel==7.4.0
      - herbie-data
      - lightgbm==4.7.0
      - pytorch-forecasting==1.8.0
